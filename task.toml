schema_version = "1.3"

[task]
name = "eeeeye/huey-atomic-schedule"

[metadata]
name = "huey-atomic-schedule"
description = "Repair durable, atomic scheduled-task promotion in Huey's SQLite backend."
difficulty = "hard"
category = "software-engineering"
tags = ["python", "sqlite", "transactions", "concurrency", "task-queues"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 180.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
allow_internet = true
workdir = "/app/huey"

[environment.healthcheck]
command = "python -c \"import huey, sqlite3; assert huey.__version__ == '3.4.0'; assert huey.__file__.startswith('/app/huey/')\""
interval_sec = 1.0
timeout_sec = 10.0
retries = 2
